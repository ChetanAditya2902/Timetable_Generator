
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch - Timetable Generator</title>
<style>
  /* Style rules will be similar for all pages, so I'm omitting them here for brevity */
</style>
</head>
<body>

<div class="header">
  <h1>Timetable Generator</h1>
  <p>Define the batches for scheduling.</p>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="courses.html">Courses</a>
  <a href="teachers.html">Teachers</a>
  <a href="rooms.html">Rooms</a>
  <a href="batch.html" class="active">Batch</a>
  <a href="courseteacher.html">Course Teacher</a>
  <a href="semestercourses.html">Semester Courses</a>
  <a href="timetable.html">Timetable</a>

</div>

<div class="main">

<div class="form-section">
  <h2>Upload Batch via CSV</h2>
  <div class="file-upload-panel">
    <input class="csv-file-input" type="file" id="batchCSV" accept=".csv,text/csv" multiple data-store-buttons="StoreBatchButton">
    <label class="file-drop-zone" for="batchCSV">
      <span class="file-drop-icon" aria-hidden="true">CSV</span>
      <span><strong>Choose batch CSV files</strong><small>Select one or more files, or drop them here</small></span>
    </label>
    <div id="batchCSVSelection" class="selected-files" aria-live="polite"></div>
  </div>
  <button type="button" onclick="convertCSVtoJSON('batchCSV', 'UploadBatchTable', ['StoreBatchButton'])">Preview selected files</button>
  <div id="UploadBatchTable" class="csv-display-table" aria-live="polite">
    <!-- The uploaded CSV content will be displayed here in a table -->
  </div>
<button type="button" id="StoreBatchButton" hidden>Store all selected rows</button>
</div>

<!-- Batch Page Form Section -->

<div class="form-section">
  <h2>View Batch Data</h2>
  <button type="button" id="ViewBatchButton">View Data</button>
  <div id="ViewBatchTable" class="csv-display-table">
    <!-- The uploaded CSV content will be displayed here in a table -->
  </div>
</div>

<div class="form-section">
  <h2>Add a Batch</h2>
  <form id="batchForm">

    <label for="Semester">Semester :</label>
    <input type="text" id="Semester" name="Semester" required>

    <label for="batchName">Batch Name:</label>
    <input type="text" id="batchName" name="batchName" required>

    <label for="branchName">Branch Name:</label>
    <input type="text" id="branchName" name="branchName" required>

    <label for="batchSize">Batch Size:</label>
    <input type="number" id="batchSize" name="batchSize" required>

    <button type="button" class="add-button" onclick="addBatch()">Add Batch</button>
    <button type="button" class="update-button" onclick="updateBatch()">Update Batch</button>
    <button type="button" class="delete-button" onclick="deleteBatch()">Delete Batch</button>
  </form>
</div>
</div>

<div class="footer">
  <p>© 2023 Timetable Generator, Inc.</p>
</div>

<script src="JS/script.js"></script>
<script src="JS/batch.js"></script>

</body>
</html>
