<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Teacher Mapping - Timetable Generator</title>
<style>
  /* Style rules will be similar for all pages, so I'm omitting them here for brevity */
</style>
</head>
<body>

<div class="header">
  <h1>Timetable Generator</h1>
  <p>Assign teachers to courses.</p>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="courses.html">Courses</a>
  <a href="teachers.html">Teachers</a>
  <a href="rooms.html">Rooms</a>
  <a href="batch.html">Batch</a>
  <a href="courseteacher.html" class="active">Course Teacher</a>
  <a href="semestercourses.html">Semester Courses</a>
  <a href="timetable.html">Timetable</a>

</div>

<div class="main">
  <div class="form-section">
    <h2>Course Teacher Mapping</h2>
    <div class="file-upload-panel">
    <input class="csv-file-input" type="file" id="CourseTeacherCSV" accept=".csv,text/csv" multiple data-store-buttons="StoreCourseTeacherButton">
    <label class="file-drop-zone" for="CourseTeacherCSV">
      <span class="file-drop-icon" aria-hidden="true">CSV</span>
      <span><strong>Choose course-teacher CSV files</strong><small>Select one or more files, or drop them here</small></span>
    </label>
    <div id="CourseTeacherCSVSelection" class="selected-files" aria-live="polite"></div>
  </div>
  <button type="button" onclick="convertCSVtoJSON('CourseTeacherCSV', 'UploadCourseTeacherTable', ['StoreCourseTeacherButton'])">Preview selected files</button>
  <div id="UploadCourseTeacherTable" class="csv-display-table" aria-live="polite">
    <!-- The uploaded CSV content will be displayed here in a table -->
  </div>
  <button type="button" id="StoreCourseTeacherButton" hidden>Store all selected rows</button>
  </div>

<div class="form-section">
  <h2>View Course Teacher Data</h2>
  <button type="button" id="ViewCourseTeacherButton">View Data</button>
  <div id="ViewCourseTeacherTable" class="csv-display-table">
  </div>
</div>

<div class="form-section">
  <h2>Add a Course Teacher Mapping</h2>
  <form id="coursesForm">
    <label for="CourseCode">Course Code:</label>
    <input type="text" id="CourseCode" name="CourseCode" required>

    <label for="TeacherID">Teacher ID:</label>
    <input type="text" id="TeacherID" name="TeacherID" required>

    <button type="button" class="add-button" onclick="addCourseTeacher()">Add Course Teacher</button>
    <button type="button" class="delete-button" onclick="deleteCourseTeacher()">Delete Course Teacher</button>
  </form>
</div>
</div>

<div class="footer">
  <p>© 2023 Timetable Generator, Inc.</p>
</div>

<script src="JS/script.js"></script>
<script src="JS/courseteacher.js"></script>

</body>
</html>
