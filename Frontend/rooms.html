
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms - Timetable Generator</title>
<style>
  /* Style rules will be similar for all pages, so I'm omitting them here for brevity */
</style>
</head>
<body>

<div class="header">
  <h1>Timetable Generator</h1>
  <p>Specify the rooms available for courses.</p>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="courses.html">Courses</a>
  <a href="teachers.html">Teachers</a>
  <a href="rooms.html" class="active">Rooms</a>
  <a href="batch.html">Batch</a>
  <a href="courseteacher.html">Course Teacher</a>
  <a href="semestercourses.html">Semester Courses</a>
  <a href="timetable.html">Timetable</a>

</div>

<div class="main">

<div class="form-section">
  <h2>Upload Rooms via CSV</h2>
  <div class="file-upload-panel">
    <input class="csv-file-input" type="file" id="RoomsCSV" accept=".csv,text/csv" multiple data-store-buttons="StoreRoomsButton">
    <label class="file-drop-zone" for="RoomsCSV">
      <span class="file-drop-icon" aria-hidden="true">CSV</span>
      <span><strong>Choose room CSV files</strong><small>Select one or more files, or drop them here</small></span>
    </label>
    <div id="RoomsCSVSelection" class="selected-files" aria-live="polite"></div>
  </div>
  <button type="button" onclick="convertCSVtoJSON('RoomsCSV', 'UploadRoomsTable', ['StoreRoomsButton'])">Preview selected files</button>
  <div id="UploadRoomsTable" class="csv-display-table" aria-live="polite">
    <!-- The uploaded CSV content will be displayed here in a table -->
  </div>
  <button type="button" id="StoreRoomsButton" hidden>Store all selected rows</button>
</div>

<div class="form-section">
  <h2>View Room Data</h2>
  <button type="button" id="ViewRoomsButton">View Data</button>
  <div id="ViewRoomsTable" class="csv-display-table">
  </div>
</div>

<!-- Classrooms Page Form Section -->
<div class="form-section">
  <h2>Add a Classroom</h2>
  <form id="classroomsForm">
    <label for="roomNo">Room Number:</label>
    <input type="text" id="roomNo" name="roomNo" required>

    <label for="roomCapacity">Room Capacity:</label>
    <input type="number" id="roomCapacity" name="roomCapacity" required>

    <button type="button" class="add-button" onclick="addRooms()">Add Rooms</button>
    <button type="button" class="update-button" onclick="updateRooms()">Update Rooms</button>
    <button type="button" class="delete-button" onclick="deleteRooms()">Delete Rooms</button>
  </form>
</div>
</div>

<div class="footer">
  <p>© 2023 Timetable Generator, Inc.</p>
</div>

<script src="JS/script.js"></script>
<script src="JS/Rooms.js"></script>

</body>
</html>
