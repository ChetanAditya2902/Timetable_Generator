<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Teacher Mapping - Timetable Generator</title>
<style>
  /* Style rules will be similar for all pages, so I'm omitting them here for brevity */
</style>
</head>
<body>

<div class="header">
  <h1>Timetable Generator</h1>
  <p>Assign semester courses.</p>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="courses.html">Courses</a>
  <a href="teachers.html">Teachers</a>
  <a href="rooms.html">Rooms</a>
  <a href="batch.html">Batch</a>
  <a href="courseteacher.html">Course Teacher</a>
  <a href="semestercourses.html" class="active">Semester Courses</a>
  <a href="timetable.html">Timetable</a>

</div>

<div class="main">
  <div class="form-section">
    <h2>Semester Course Mapping</h2>
    <div class="file-upload-panel">
    <input class="csv-file-input" type="file" id="SemesterCoursesCSV" accept=".csv,text/csv" multiple data-store-buttons="StoreSemesterCoursesButton">
    <label class="file-drop-zone" for="SemesterCoursesCSV">
      <span class="file-drop-icon" aria-hidden="true">CSV</span>
      <span><strong>Choose semester-course CSV files</strong><small>Select one or more files, or drop them here</small></span>
    </label>
    <div id="SemesterCoursesCSVSelection" class="selected-files" aria-live="polite"></div>
  </div>
  <button type="button" onclick="convertCSVtoJSON('SemesterCoursesCSV', 'UploadSemesterCoursesTable', ['StoreSemesterCoursesButton'])">Preview selected files</button>
  <div id="UploadSemesterCoursesTable" class="csv-display-table" aria-live="polite">
    <!-- The uploaded CSV content will be displayed here in a table -->
  </div>
  <button type="button" id="StoreSemesterCoursesButton" hidden>Store all selected rows</button>
  </div>

<div class="form-section">
  <h2>View Semester Course Data</h2>
  <button type="button" id="ViewSemesterCoursesButton">View Data</button>
  <div id="ViewSemesterCoursesTable" class="csv-display-table">
  </div>
</div>

<div class="form-section">
  <h2>Add a Semester Course</h2>
  <form id="coursesForm">
    <label for="semester">Semester:</label>
    <input type="text" id="semester" name="semester" required>

    <label for="branchname">Branch Name:</label>
    <input type="text" id="branchname" name="branchname" required>

    <label for="previousCourseCode">Current Course Code (for update):</label>
    <input type="text" id="previousCourseCode" name="previousCourseCode">

    <label for="code">Course Code (new course code for update):</label>
    <input type="text" id="code" name="code" required>

    <button type="button" class="add-button" onclick="addSemesterCourse()">Add Semester Course</button>
    <button type="button" class="update-button" onclick="updateSemesterCourse()">Update Semester Course</button>
    <button type="button" class="delete-button" onclick="deleteSemesterCourse()">Delete Semester Course</button>
  </form>
</div>
</div>

<div class="footer">
  <p>© 2023 Timetable Generator, Inc.</p>
</div>

<script src="JS/script.js"></script>
<script src="JS/semestercourse.js"></script>

</body>
</html>
